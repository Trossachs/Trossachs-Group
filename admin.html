<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Trossachs Admin</title>
<link rel="icon" href="assets/favicon.png" type="image/png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Playfair+Display:wght@500&display=swap">
<link rel="stylesheet" href="css/admin.css">
<script>
try{var tg=localStorage.getItem('tg-theme');if(tg==='light'||tg==='dark')document.documentElement.dataset.theme=tg;}catch(e){}
</script>
</head>
<body>

<!-- sign in -->
<main class="login" id="login" hidden>
  <form class="login-card" id="loginForm" autocomplete="on">
    <img src="assets/logo-mark.png" alt="" width="72" height="45">
    <h1>Trossachs Admin</h1>
    <p class="muted">Sign in to edit the site and read messages.</p>
    <label class="f"><span>Username</span><input type="text" id="lu" name="username" autocomplete="username" autocapitalize="off" spellcheck="false" required></label>
    <label class="f"><span>Password</span><input type="password" id="lp" name="password" autocomplete="current-password" required></label>
    <p class="login-msg" id="loginMsg" role="alert"></p>
    <button class="btn primary" type="submit">Sign in</button>
    <a class="back" href="index.html">Back to the site</a>
  </form>
</main>

<!-- admin app -->
<div id="app" hidden>
  <header class="topbar">
    <a class="tb-brand" href="index.html" title="Open the site"><img src="assets/logo-mark.png" alt="" width="44" height="28"><span>Admin</span></a>
    <div class="status" id="status" role="status" aria-live="polite"><i></i><span id="statusText">All changes saved</span></div>
    <div class="tb-actions">
      <a class="btn ghost sm" href="index.html" target="_blank" rel="noopener">View site</a>
      <button class="btn ghost sm" id="themeBtn" type="button" aria-label="Switch light or dark mode">Theme</button>
      <button class="btn ghost sm" id="logoutBtn" type="button">Sign out</button>
    </div>
  </header>
  <div class="layout">
    <nav class="side" id="side" aria-label="Sections"></nav>
    <main class="pane" id="pane" tabindex="-1"></main>
  </div>
</div>

<script src="js/defaults.js"></script>
<script src="js/content.js"></script>
<script src="js/store.js"></script>
<script src="js/admin.js"></script>
</body>
</html>

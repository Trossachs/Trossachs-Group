<!doctype html>
<html lang="en" data-theme="system">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex, nofollow">
<title>Sign in — Trossachs Group Admin</title>
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<script src="/assets/theme.js"></script>
<link rel="stylesheet" href="/assets/site.css">
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
<main class="login-wrap" id="main">
  <form class="login-card glass" id="form" novalidate>
    <span class="brand">TROSSACHS GROUP</span>
    <div>
      <h1>Admin sign in</h1>
    </div>
    <p class="sub">Manage the portfolio content, projects and images.</p>
    <div class="field">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="username" required autofocus>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
    </div>
    <p class="form-error" id="error" role="alert" aria-live="assertive"></p>
    <button class="btn primary" type="submit" id="submit">Sign in</button>
    <a href="/" class="sub" style="text-align:center;color:var(--fg-3);font-size:14px">← Back to website</a>
  </form>
</main>
<script src="/admin/login.js"></script>
</body>
</html>
